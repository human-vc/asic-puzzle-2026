project:
  title:        "Star Battle checker"
  author:       "Jacob Crainic"
  discord:      ""
  description:  "Reads an 11x11 grid as 121 serial bits and reports whether it is a valid two-star Star Battle solution, then streams a message out"
  language:     "Verilog"
  clock_hz:     10000000
  tiles:        "1x1"
  top_module:   "tt_um_starbattle_checker"
  source_files:
    - "project.v"
    - "puzzle_rtl.v"

pinout:
  ui[0]: "grid bit (row-major, one per clock while feed is high)"
  ui[1]: "feed - consume a grid bit this cycle"
  ui[2]: ""
  ui[3]: ""
  ui[4]: ""
  ui[5]: ""
  ui[6]: ""
  ui[7]: ""

  uo[0]: "message byte, bit 0"
  uo[1]: "message byte, bit 1"
  uo[2]: "message byte, bit 2"
  uo[3]: "message byte, bit 3"
  uo[4]: "message byte, bit 4"
  uo[5]: "message byte, bit 5"
  uo[6]: "message byte, bit 6"
  uo[7]: "message byte, bit 7"

  uio[0]: "success (output)"
  uio[1]: ""
  uio[2]: ""
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""
