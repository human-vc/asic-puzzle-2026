<svg xmlns="http://www.w3.org/2000/svg" width="780" height="486" viewBox="0 0 780 486" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
<rect width="780" height="486" fill="#fbfcfd"/>
<defs><marker id="a" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#767f90"/></marker></defs>
<text x="24" y="28" font-size="12.5" fill="#12151a">121 bits in, one per clock. 92 flip-flops in total, and nowhere to keep a grid.</text>
<rect x="24" y="52" width="92" height="54" rx="4" fill="#eef4fc" stroke="#2a78d6"/>
<text x="35" y="71" font-size="11.5" fill="#12151a">I</text>
<text x="35" y="86" font-size="10" fill="#767f90">1 bit</text>
<text x="35" y="100" font-size="9.5" fill="#767f90">per clock</text>
<text x="24" y="126" font-size="9" fill="#767f90">clk, enable, rst_n</text>
<rect x="148" y="52" width="200" height="54" rx="4" fill="#eef4fc" stroke="#2a78d6"/>
<text x="159" y="71" font-size="11.5" fill="#12151a">input delay line</text>
<text x="159" y="86" font-size="10" fill="#767f90">12 cells, 12 flops</text>
<text x="159" y="100" font-size="9.5" fill="#767f90">the previous twelve bits</text>
<rect x="148" y="112" width="200" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="159" y="131" font-size="11.5" fill="#12151a">cell counter (mod 11)</text>
<text x="159" y="146" font-size="10" fill="#767f90">5 cells, 4 flops</text>
<text x="159" y="160" font-size="9.5" fill="#767f90">column of the arriving bit</text>
<rect x="148" y="172" width="200" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="159" y="191" font-size="11.5" fill="#12151a">row counter</text>
<text x="159" y="206" font-size="10" fill="#767f90">9 cells, 4 flops</text>
<text x="159" y="220" font-size="9.5" fill="#767f90">row of the arriving bit</text>
<rect x="148" y="232" width="200" height="48" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="159" y="251" font-size="11.5" fill="#12151a">run / done flag</text>
<text x="159" y="266" font-size="10" fill="#767f90">3 cells, 2 flops</text>
<text x="159" y="280" font-size="9.5" fill="#767f90">end of the stream</text>
<text x="392" y="42" font-size="11" fill="#767f90">the five rules, settled as the stream runs</text>
<rect x="392" y="52" width="300" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="403" y="71" font-size="11.5" fill="#12151a">adjacency check</text>
<text x="403" y="86" font-size="10" fill="#767f90">7 cells, 1 flops</text>
<text x="403" y="100" font-size="9.5" fill="#767f90">taps 1 and 10-12, masked at row edges</text>
<rect x="392" y="112" width="300" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="403" y="131" font-size="11.5" fill="#12151a">row accumulator</text>
<text x="403" y="146" font-size="10" fill="#767f90">9 cells, 3 flops</text>
<text x="403" y="160" font-size="9.5" fill="#767f90">one-hot, cleared at every row boundary</text>
<rect x="392" y="172" width="300" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="403" y="191" font-size="11.5" fill="#12151a">column accumulators</text>
<text x="403" y="206" font-size="10" fill="#767f90">59 cells, 22 flops</text>
<text x="403" y="220" font-size="9.5" fill="#767f90">11 tallies, 2 bits saturating at 3</text>
<rect x="392" y="232" width="300" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="403" y="251" font-size="11.5" fill="#12151a">region accumulators</text>
<text x="403" y="266" font-size="10" fill="#767f90">206 cells, 22 flops</text>
<text x="403" y="280" font-size="9.5" fill="#767f90">11 tallies, against the hard-wired map</text>
<rect x="392" y="292" width="300" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="403" y="311" font-size="11.5" fill="#12151a">total-star counter</text>
<text x="403" y="326" font-size="10" fill="#767f90">22 cells, 8 flops</text>
<text x="403" y="340" font-size="9.5" fill="#767f90">redundant, and still load-bearing</text>
<rect x="392" y="376" width="300" height="54" rx="4" fill="#eef4fc" stroke="#2a78d6"/>
<text x="403" y="395" font-size="11.5" fill="#12151a">success latch</text>
<text x="403" y="410" font-size="10" fill="#767f90">32 cells, 2 flops</text>
<text x="403" y="424" font-size="9.5" fill="#767f90">one cycle after the last bit</text>
<rect x="24" y="376" width="300" height="54" rx="4" fill="#ffffff" stroke="#ccd2dd"/>
<text x="35" y="395" font-size="11.5" fill="#12151a">output generator</text>
<text x="35" y="410" font-size="10" fill="#767f90">208 cells, 12 flops (8 LFSR, 4 index)</text>
<text x="35" y="424" font-size="9.5" fill="#767f90">O = permute(LFSR) xor mask(index), gated by success</text>
<path d="M116 79 L132 79" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M132 79 L132 346" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M132 79 L148 79" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
