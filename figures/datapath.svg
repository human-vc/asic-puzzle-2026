<path d="M132 199 L148 199" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M132 346 L364 346" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M364 139 L364 346" stroke="#767f90" stroke-width="1.2" fill="none"/>
<circle cx="364" cy="346" r="3" fill="#767f90"/>
<text x="142" y="340" font-size="9.5" fill="#767f90">the bit and its position</text>
<path d="M348 139 L364 139" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M348 199 L364 199" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M364 139 L392 139" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M364 199 L392 199" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M364 259 L392 259" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M364 319 L392 319" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M348 79 L392 79" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="354" y="72" font-size="9.5" fill="#767f90">taps</text>
<path d="M692 79 L716 79" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M692 139 L716 139" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M692 199 L716 199" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M692 259 L716 259" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M692 319 L716 319" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M716 79 L716 403" stroke="#767f90" stroke-width="1.2" fill="none"/>
<path d="M716 403 L692 403" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<path d="M392 403 L324 403" stroke="#767f90" stroke-width="1.2" fill="none" marker-end="url(#a)"/>
<text x="340" y="396" font-size="9.5" fill="#767f90">start</text>
<text x="24" y="462" font-size="9.5" fill="#767f90">the 15 payload bytes exist nowhere on the die; they appear only as the LFSR walks away from its seed</text>
</svg>